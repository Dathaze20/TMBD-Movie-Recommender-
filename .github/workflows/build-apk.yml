name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run downloads the Android SDK/NDK, so allow plenty of headroom.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # libltdl-dev is not optional: python-for-android's libffi recipe runs
      # autoreconf on libffi 3.4.2, whose configure.ac calls
      # LT_SYS_SYMBOL_USCORE. That macro lives in /usr/share/aclocal/ltdl.m4,
      # which only libltdl-dev installs - without it autoreconf fails with
      # "possibly undefined macro" and the whole build dies. The recipe's own
      # docstring calls this out.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev ccache

      - name: Verify libffi's autoreconf macro is available
        run: |
          grep -rl 'AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]' /usr/share/aclocal/ \
            || { echo "::error::LT_SYS_SYMBOL_USCORE missing; the libffi recipe will fail"; exit 1; }

      # Catches a p4a footgun in seconds instead of ~19 minutes into the build.
      - name: Check pip requirements are not hyphenated
        run: |
          python3 - <<'PY'
          import configparser, re, sys
          cfg = configparser.ConfigParser()
          cfg.read('buildozer.spec')
          reqs = [r.strip() for r in cfg['app']['requirements'].split(',') if r.strip()]
          # These are p4a recipes, not pip installs, so the rule does not apply.
          recipes = {'python3', 'kivy', 'openssl', 'sdl2', 'sdl3', 'pyjnius',
                     'android', 'sqlite3', 'png', 'freetype', 'libffi'}
          bad = [r for r in reqs
                 if re.split(r'[=<>!~]', r, 1)[0].strip().lower() not in recipes
                 and '-' in re.split(r'[=<>!~]', r, 1)[0]]
          if bad:
              print(f"::error::Hyphenated pip requirement(s) in buildozer.spec: {bad}. "
                    "python-for-android matches wheel names normalised to underscores "
                    "against requirement names as written, so a hyphen makes it append "
                    "the resolved wheel URL alongside your pin, and pip fails with "
                    "ResolutionImpossible. Spell these with underscores.")
              sys.exit(1)
          print("requirements OK:", reqs)
          PY

      # p4a happily resolves an Android wheel, then installs the requirements
      # with a plain host pip that has no --platform flag and rejects it
      # ("not a supported wheel on this platform"). Only py3-none-any wheels
      # survive that round trip, so refuse anything publishing Android wheels.
      - name: Check pip requirements ship pure-Python wheels
        run: |
          python3 - <<'PY'
          import configparser, json, re, sys, urllib.request
          cfg = configparser.ConfigParser()
          cfg.read('buildozer.spec')
          reqs = [r.strip() for r in cfg['app']['requirements'].split(',') if r.strip()]
          recipes = {'python3', 'kivy', 'openssl', 'sdl2', 'sdl3', 'pyjnius',
                     'android', 'sqlite3', 'png', 'freetype', 'libffi'}
          bad = []
          for spec in reqs:
              name = re.split(r'[=<>!~]', spec, 1)[0].strip()
              if name.lower() in recipes:
                  continue
              try:
                  url = f"https://pypi.org/pypi/{name.replace('_', '-')}/json"
                  data = json.load(urllib.request.urlopen(url, timeout=30))
              except Exception as e:
                  print(f"  {name}: could not check ({e}) - skipping")
                  continue
              ver = data['info']['version']
              whls = [f['filename'] for f in data['releases'].get(ver, [])
                      if f['filename'].endswith('.whl')]
              android = [w for w in whls if 'android' in w]
              pinned = any(c in spec for c in '=<>!~')
              print(f"  {name}: latest {ver}, android wheels: {len(android)}"
                    f"{' (pinned)' if pinned else ''}")
              # Only a problem when we are NOT pinning away from it.
              if android and not pinned:
                  bad.append(f"{name} (latest {ver})")
          if bad:
              print(f"::error::These requirements publish Android wheels: {bad}. "
                    "p4a resolves them but its install step uses a host pip with no "
                    "--platform flag and rejects them. Pin to a version that ships "
                    "only py3-none-any wheels.")
              sys.exit(1)
          PY

      # cython<3.2 is the ceiling python-for-android's pyjnius recipe
      # declares; its kivy and android recipes only require >=0.29.1.
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.6.0 "cython<3.2"

      # The SDK/NDK download is multi-GB and dominates build time, so cache it.
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-v4-${{ runner.os }}-

      - name: Cache compiled recipes
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-v4-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-v4-${{ runner.os }}-

      # buildozer.spec bundles .env via source.include_patterns, so setting a
      # TMDB_API_KEY repository secret overrides the key built into main.py.
      # Without the secret the app falls back to its built-in key as usual.
      - name: Write .env from secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then
            printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env
            echo "TMDB_API_KEY secret found - bundling it into the APK."
          else
            echo "No TMDB_API_KEY secret - the app will use its built-in key."
          fi

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Show artifacts
        run: ls -lh bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-movie-recommender-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
